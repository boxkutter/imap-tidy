# mail-translate: works as-is with the Unraid 7 Compose Manager plugin.
#   1. Put your config in /mnt/user/appdata/mail-translate/config.yml
#      (copy config.example.yml from the repo and edit it).
#   2. Put passwords / API keys in the .env file (see .env.example), in single quotes.
#   3. Compose Up.

services:
  mail-translate:
    image: ghcr.io/boxkutter/imap-tidy:latest
    # build: https://github.com/boxkutter/imap-tidy.git#main   # alternative: build from source
    container_name: mail-translate
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: 99        # nobody  (Unraid appdata default)
      PGID: 100       # users
    volumes:
      - /mnt/user/appdata/mail-translate:/data   # config.yml + state/

  # Optional: run LibreTranslate alongside. Not needed if you already run one;
  # just set LT_URL in .env to its address.
  # libretranslate:
  #   image: libretranslate/libretranslate:latest
  #   container_name: libretranslate
  #   restart: unless-stopped
  #   environment:
  #     - LT_LOAD_ONLY=en,sv,de,fr,es,it,nl,pt,pl,ru,ja,zh   # trim to what you receive
  #   volumes:
  #     - /mnt/user/appdata/libretranslate:/home/libretranslate/.local
